<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <link rel="stylesheet" href="styles.css">
  <title>Frontend Mentor | Social links profile</title>

</head>
<body>
  <main>
    <div class="card">
      <div class="upper">
        <img src="./assets/images/avatar-jessica.jpeg" alt="profile-pic">
      <h3>Jessica Randall</h3>
      <h4>London, United Kingdom</h4>
      <p>"Front-end developer and avid reader."</p>
      </div>
      <div class="lower">
        <a class="click-me" href="#">Frontend Mentor</a>
        <a class="click-me" href="#">GitHub</a>
        <a class="click-me" href="#">LinkedIn</a>
        <a class="click-me" href="#">Twitter</a>
        <a class="click-me" href="#">Instagram</a>
      </div>
    </div>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Aayush</a>.
  </footer>
</body>
</html>
